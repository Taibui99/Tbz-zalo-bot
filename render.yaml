services:
  - type: web
    name: zalo-bot
    runtime: python
    plan: free
    buildCommand: apt-get update && apt-get install -y ffmpeg && pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: ZALO_BOT_TOKEN
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-flash-latest
      - key: IMAGE_GEN_MODELS
        value: gemini-2.5-flash-image,gemini-3.1-flash-image-preview,gemini-3-pro-image
      - key: ZALO_VOICE
        value: vi-VN-HoaiMyNeural